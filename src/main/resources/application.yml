spring:
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
      enabled: true
  application:
    name: backend
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb+srv://piyush_db_user:V6P3Y52aIXElLWNs@smartcosec.ttli1le.mongodb.net/globalisor?appName=smartcosec}
      database: ${SPRING_DATA_MONGODB_DATABASE:globalisor}
      auto-index-creation: false

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  tomcat:
    connection-timeout: 60000
    threads:
      max: 25
      min-spare: 5
    max-connections: 200
    accept-count: 50

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.springframework.web.servlet: WARN
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: ERROR
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    org.apache.tomcat: WARN
    org.mongodb.driver.cluster: WARN
    com.globalisor.backend: INFO

globalisor:
  app:
    jwtSecret: ${GLOBALISOR_APP_JWTSECRET:globalisorSecretKeyThatIsVeryLongAndSecureEnoughForHS256Algorithm1234567890}
    jwtExpirationMs: ${GLOBALISOR_APP_JWTEXPIRATIONMS:86400000}
    seed: ${GLOBALISOR_APP_SEED:false}

gemini:
  api:
    key: ${GEMINI_API_KEY:""}

gcp:
  storage:
    bucket-name: ${GCP_STORAGE_BUCKET_NAME:globalisor-client-documents}
    credentials-file: ${GCP_CREDENTIALS_FILE:gcp-key.json}
    credentials-json: ${GCP_CREDENTIALS_JSON:""}
